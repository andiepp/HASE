[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hase-client"
version = "0.5.0"
description = "Descriptor-driven Python client for the HASE Runtime Host"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "grpcio==1.83.0",
    "protobuf==7.35.1",
]

[project.optional-dependencies]
development = [
    "grpcio-tools==1.83.0",
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
