syntax = "proto3";

package hase.runtime.remote.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Hase.Runtime.Remote.Grpc.V1";

// Version 1 remote contract for operational runtime-host access.
service RuntimeHostRemoteApi {
  rpc GetSnapshot (GetSnapshotRequest) returns (GetSnapshotResponse);
}

message GetSnapshotRequest {
}

message GetSnapshotResponse {
  string runtime_host_id = 1;
  RuntimeHostApiVersion api_version = 2;
  repeated PublishedRuntimeEndpointSnapshot endpoints = 3;
}

message RuntimeHostApiVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message PublishedRuntimeEndpointSnapshot {
  string endpoint_id = 1;
  string attachment_generation = 2;
  EndpointDescriptor descriptor = 3;
  EndpointConnectionStatus connection_status = 4;
}

message EndpointDescriptor {
  string endpoint_id = 1;
  optional string display_name = 2;
  optional string description = 3;
  repeated InstrumentDescriptor instruments = 4;
}

message InstrumentDescriptor {
}

message EndpointConnectionStatus {
  EndpointConnectionState state = 1;
  google.protobuf.Timestamp changed_at_utc = 2;
  optional string detail = 3;
}

enum EndpointConnectionState {
  ENDPOINT_CONNECTION_STATE_UNSPECIFIED = 0;
  ENDPOINT_CONNECTION_STATE_DISCONNECTED = 1;
  ENDPOINT_CONNECTION_STATE_CONNECTING = 2;
  ENDPOINT_CONNECTION_STATE_SYNCHRONIZING = 3;
  ENDPOINT_CONNECTION_STATE_READY = 4;
  ENDPOINT_CONNECTION_STATE_RECONNECTING = 5;
  ENDPOINT_CONNECTION_STATE_FAULTED = 6;
}
