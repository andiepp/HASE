syntax = "proto3";

package hase.runtime.remote.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

option csharp_namespace = "Hase.Runtime.Remote.Grpc.V1";

// Version 1 remote contract for operational runtime-host access.
service RuntimeHostRemoteApi {
  rpc GetSnapshot (GetSnapshotRequest) returns (GetSnapshotResponse);
  rpc ReadCachedProperty (ReadCachedPropertyRequest) returns (CachedPropertyResult);
  rpc ReadAuthoritativeProperty (ReadAuthoritativePropertyRequest) returns (PropertyOperationResult);
  rpc WriteProperty (WritePropertyRequest) returns (PropertyOperationResult);
  rpc ExecuteCommand (ExecuteCommandRequest) returns (CommandOperationResult);
  rpc Observe (ObserveRequest) returns (stream ObserveResponse);
  rpc ObserveDiagnostics (ObserveDiagnosticsRequest) returns (stream ProjectedDiagnosticObservation);
}

message GetSnapshotRequest {
}

message ReadCachedPropertyRequest {
  PropertyTarget target = 1;
}

message ReadAuthoritativePropertyRequest {
  PropertyTarget target = 1;
}

message WritePropertyRequest {
  PropertyTarget target = 1;
  RemoteValue requested_value = 2;
}

message ExecuteCommandRequest {
  CommandTarget target = 1;
  RemoteValue argument = 2;
}

message GetSnapshotResponse {
  string runtime_host_id = 1;
  RuntimeHostApiVersion api_version = 2;
  repeated PublishedRuntimeEndpointSnapshot endpoints = 3;
}

message RuntimeHostApiVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message RemoteValue {
  oneof kind {
    bool boolean_value = 1;
    string string_value = 2;
    double numeric_value = 3;
    bytes byte_array_value = 4;
  }
}

message PropertyTarget {
  string endpoint_id = 1;
  string attachment_generation = 2;
  string instrument_id = 3;
  string property_id = 4;
}

enum PropertyOperationStatus {
  PROPERTY_OPERATION_STATUS_UNSPECIFIED = 0;
  PROPERTY_OPERATION_STATUS_SUCCESS = 1;
  PROPERTY_OPERATION_STATUS_ATTACHMENT_NOT_CURRENT = 2;
  PROPERTY_OPERATION_STATUS_INSTRUMENT_NOT_FOUND = 3;
  PROPERTY_OPERATION_STATUS_PROPERTY_NOT_FOUND = 4;
  PROPERTY_OPERATION_STATUS_READ_NOT_SUPPORTED = 5;
  PROPERTY_OPERATION_STATUS_WRITE_NOT_SUPPORTED = 6;
  PROPERTY_OPERATION_STATUS_INVALID_VALUE = 7;
  PROPERTY_OPERATION_STATUS_ENDPOINT_UNAVAILABLE = 8;
  PROPERTY_OPERATION_STATUS_ENDPOINT_REJECTED = 9;
  PROPERTY_OPERATION_STATUS_ENDPOINT_FAILURE = 10;
  PROPERTY_OPERATION_STATUS_TIMED_OUT = 11;
}

message PropertyValue {
  RemoteValue value = 1;
  google.protobuf.Timestamp timestamp_utc = 2;
  PropertyQuality quality = 3;
}

enum PropertyQuality {
  PROPERTY_QUALITY_UNSPECIFIED = 0;
  PROPERTY_QUALITY_GOOD = 1;
  PROPERTY_QUALITY_UNCERTAIN = 2;
  PROPERTY_QUALITY_BAD = 3;
}

message PublishedRuntimePropertySnapshot {
  PropertyTarget target = 1;
  PropertyDescriptor descriptor = 2;
  EndpointConnectionStatus connection_status = 3;
  PropertyValue current_value = 4;
}

message CachedPropertyResult {
  PropertyOperationStatus status = 1;
  PublishedRuntimePropertySnapshot snapshot = 2;
  optional string diagnostic = 3;
}

message PropertyOperationResult {
  PropertyOperationStatus status = 1;
  PropertyValue confirmed_value = 2;
  optional string diagnostic = 3;
}

message CommandTarget {
  string endpoint_id = 1;
  string attachment_generation = 2;
  string instrument_id = 3;
  repeated string command_path_segments = 4;
}

enum CommandOperationStatus {
  COMMAND_OPERATION_STATUS_UNSPECIFIED = 0;
  COMMAND_OPERATION_STATUS_SUCCESS = 1;
  COMMAND_OPERATION_STATUS_ATTACHMENT_NOT_CURRENT = 2;
  COMMAND_OPERATION_STATUS_INSTRUMENT_NOT_FOUND = 3;
  COMMAND_OPERATION_STATUS_COMMAND_NOT_FOUND = 4;
  COMMAND_OPERATION_STATUS_ARGUMENT_NOT_SUPPORTED = 5;
  COMMAND_OPERATION_STATUS_ENDPOINT_UNAVAILABLE = 6;
  COMMAND_OPERATION_STATUS_ENDPOINT_REJECTED = 7;
  COMMAND_OPERATION_STATUS_ENDPOINT_FAILURE = 8;
  COMMAND_OPERATION_STATUS_TIMED_OUT = 9;
}

message CommandOperationResult {
  CommandOperationStatus status = 1;
  RemoteValue return_value = 2;
  optional string diagnostic = 3;
}

message ObserveRequest {
}

message ObserveDiagnosticsRequest {
}

message ProjectedDiagnosticObservation {
  uint64 sequence = 1;
  ProjectedDiagnosticRecord record = 2;
}

message ProjectedDiagnosticRecord {
  string runtime_host_id = 1;
  uint64 source_sequence = 2;
  google.protobuf.Timestamp timestamp_utc = 3;
  RuntimeDiagnosticLevel level = 4;
  RuntimeDiagnosticCategory category = 5;
  string event_name = 6;
  RuntimeDiagnosticSeverity severity = 7;
  optional string endpoint_id = 8;
  optional string attachment_generation = 9;
  optional RuntimeDiagnosticDirection direction = 10;
  optional string operation_id = 11;
  google.protobuf.Duration duration = 12;
  optional RuntimeDiagnosticOutcome outcome = 13;
  map<string, string> details = 14;
  ProjectedDiagnosticByteSnapshot byte_snapshot = 15;
}

message ProjectedDiagnosticByteSnapshot {
  uint64 original_byte_count = 1;
  bytes captured_bytes = 2;
  bool is_truncated = 3;
}

enum RuntimeDiagnosticLevel {
  RUNTIME_DIAGNOSTIC_LEVEL_UNSPECIFIED = 0;
  RUNTIME_DIAGNOSTIC_LEVEL_OPERATIONAL = 1;
  RUNTIME_DIAGNOSTIC_LEVEL_PROTOCOL = 2;
  RUNTIME_DIAGNOSTIC_LEVEL_BYTES = 3;
}

enum RuntimeDiagnosticCategory {
  RUNTIME_DIAGNOSTIC_CATEGORY_UNSPECIFIED = 0;
  RUNTIME_DIAGNOSTIC_CATEGORY_RUNTIME_ATTACHMENT = 1;
  RUNTIME_DIAGNOSTIC_CATEGORY_RUNTIME_CONNECTION = 2;
  RUNTIME_DIAGNOSTIC_CATEGORY_RUNTIME_SYNCHRONIZATION = 3;
  RUNTIME_DIAGNOSTIC_CATEGORY_RUNTIME_RECOVERY = 4;
  RUNTIME_DIAGNOSTIC_CATEGORY_RUNTIME_PROPERTY = 5;
  RUNTIME_DIAGNOSTIC_CATEGORY_RUNTIME_COMMAND = 6;
  RUNTIME_DIAGNOSTIC_CATEGORY_RUNTIME_EVENT = 7;
  RUNTIME_DIAGNOSTIC_CATEGORY_PROTOCOL_EXCHANGE = 8;
  RUNTIME_DIAGNOSTIC_CATEGORY_TRANSPORT_BYTES = 9;
}

enum RuntimeDiagnosticSeverity {
  RUNTIME_DIAGNOSTIC_SEVERITY_UNSPECIFIED = 0;
  RUNTIME_DIAGNOSTIC_SEVERITY_TRACE = 1;
  RUNTIME_DIAGNOSTIC_SEVERITY_INFORMATION = 2;
  RUNTIME_DIAGNOSTIC_SEVERITY_WARNING = 3;
  RUNTIME_DIAGNOSTIC_SEVERITY_ERROR = 4;
}

enum RuntimeDiagnosticDirection {
  RUNTIME_DIAGNOSTIC_DIRECTION_UNSPECIFIED = 0;
  RUNTIME_DIAGNOSTIC_DIRECTION_OUTBOUND = 1;
  RUNTIME_DIAGNOSTIC_DIRECTION_INBOUND = 2;
}

enum RuntimeDiagnosticOutcome {
  RUNTIME_DIAGNOSTIC_OUTCOME_UNSPECIFIED = 0;
  RUNTIME_DIAGNOSTIC_OUTCOME_SUCCEEDED = 1;
  RUNTIME_DIAGNOSTIC_OUTCOME_FAILED = 2;
  RUNTIME_DIAGNOSTIC_OUTCOME_CANCELLED = 3;
  RUNTIME_DIAGNOSTIC_OUTCOME_TIMED_OUT = 4;
}

message ObserveResponse {
  oneof content {
    ObservationInitialSnapshot initial_snapshot = 1;
    RuntimeHostObservation observation = 2;
  }
}

message ObservationInitialSnapshot {
  GetSnapshotResponse snapshot = 1;
  uint64 snapshot_sequence = 2;
}

message RuntimeHostObservation {
  uint64 sequence = 1;
  string endpoint_id = 2;
  string attachment_generation = 3;
  RuntimeHostObservationKind kind = 4;

  oneof payload {
    AttachmentPublishedObservation attachment_published = 5;
    AttachmentEndedObservation attachment_ended = 6;
    ConnectionStatusChangedObservation connection_status_changed = 7;
    PropertyValueChangedObservation property_value_changed = 8;
    EventOccurredObservation event_occurred = 9;
  }
}

enum RuntimeHostObservationKind {
  RUNTIME_HOST_OBSERVATION_KIND_UNSPECIFIED = 0;
  RUNTIME_HOST_OBSERVATION_KIND_ATTACHMENT_PUBLISHED = 1;
  RUNTIME_HOST_OBSERVATION_KIND_ATTACHMENT_ENDED = 2;
  RUNTIME_HOST_OBSERVATION_KIND_CONNECTION_STATUS_CHANGED = 3;
  RUNTIME_HOST_OBSERVATION_KIND_PROPERTY_VALUE_CHANGED = 4;
  RUNTIME_HOST_OBSERVATION_KIND_EVENT_OCCURRED = 5;
}

message AttachmentPublishedObservation {
  PublishedRuntimeEndpointSnapshot endpoint = 1;
}

message AttachmentEndedObservation {
  google.protobuf.Timestamp ended_at_utc = 1;
}

message ConnectionStatusChangedObservation {
  EndpointConnectionStatus previous_status = 1;
  EndpointConnectionStatus current_status = 2;
}

message PropertyValueChangedObservation {
  string instrument_id = 1;
  string property_id = 2;
  PropertyValue previous_value = 3;
  PropertyValue current_value = 4;
}

message EventOccurredObservation {
  string instrument_id = 1;
  repeated string event_path_segments = 2;
  google.protobuf.Timestamp occurred_at_utc = 3;
  RemoteValue value = 4;
}

message PublishedRuntimeEndpointSnapshot {
  string endpoint_id = 1;
  string attachment_generation = 2;
  EndpointDescriptor descriptor = 3;
  EndpointConnectionStatus connection_status = 4;
}

message EndpointDescriptor {
  string endpoint_id = 1;
  optional string display_name = 2;
  optional string description = 3;
  repeated InstrumentDescriptor instruments = 4;
}

message InstrumentDescriptor {
  string instrument_id = 1;
  string name = 2;
  string kind = 3;
  optional string manufacturer = 4;
  optional string model = 5;
  optional string serial_number = 6;
  optional string firmware_version = 7;
  optional string hardware_revision = 8;
  optional string description = 9;
  repeated PropertyDescriptor properties = 10;
  repeated CommandDescriptor commands = 11;
  repeated EventDescriptor events = 12;
}

message PropertyDescriptor {
  string property_id = 1;
  repeated string path_segments = 2;
  string display_name = 3;
  optional string description = 4;
  PropertyAccessMode access_mode = 5;
  DataDescriptor data = 6;
  PropertyPresentation presentation = 7;
}

enum PropertyAccessMode {
  PROPERTY_ACCESS_MODE_NONE = 0;
  PROPERTY_ACCESS_MODE_READ = 1;
  PROPERTY_ACCESS_MODE_WRITE = 2;
  PROPERTY_ACCESS_MODE_READ_WRITE = 3;
}

message DataDescriptor {
  oneof kind {
    NumericDataDescriptor numeric = 1;
    BooleanDataDescriptor boolean_descriptor = 2;
    StringDataDescriptor string_descriptor = 3;
    ByteArrayDataDescriptor byte_array_descriptor = 4;
  }
}

message NumericDataDescriptor {
  Quantity quantity = 1;
  Unit native_unit = 2;
  ValueRange range = 3;
  Resolution resolution = 4;
}

message PropertyPresentation {
  optional string group_id = 1;
  QuantityValue abscissa = 2;
}

message QuantityValue {
  double value = 1;
  Unit unit = 2;
}

message BooleanDataDescriptor {
}

message StringDataDescriptor {
}

message ByteArrayDataDescriptor {
}

message Quantity {
  string id = 1;
  string display_name = 2;
}

message Unit {
  string id = 1;
  string display_name = 2;
  string symbol = 3;
  Quantity quantity = 4;
}

message ValueRange {
  double minimum = 1;
  double maximum = 2;
}

message Resolution {
  double value = 1;
}

message CommandDescriptor {
  repeated string path_segments = 1;
  string display_name = 2;
  optional string description = 3;
  CommandArgumentDescriptor argument = 4;
}

message CommandArgumentDescriptor {
  string display_name = 1;
  optional string description = 2;
  DataDescriptor data = 3;
}

message EventDescriptor {
  repeated string path_segments = 1;
  string display_name = 2;
  optional string description = 3;
  EventPayloadDescriptor payload = 4;
}

message EventPayloadDescriptor {
  string display_name = 1;
  optional string description = 2;
  DataDescriptor data = 3;
}

message EndpointConnectionStatus {
  EndpointConnectionState state = 1;
  google.protobuf.Timestamp changed_at_utc = 2;
  optional string detail = 3;
}

enum EndpointConnectionState {
  ENDPOINT_CONNECTION_STATE_UNSPECIFIED = 0;
  ENDPOINT_CONNECTION_STATE_DISCONNECTED = 1;
  ENDPOINT_CONNECTION_STATE_CONNECTING = 2;
  ENDPOINT_CONNECTION_STATE_SYNCHRONIZING = 3;
  ENDPOINT_CONNECTION_STATE_READY = 4;
  ENDPOINT_CONNECTION_STATE_RECONNECTING = 5;
  ENDPOINT_CONNECTION_STATE_FAULTED = 6;
}
