<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; media-src 'none'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>HASE media binding</title>
  <link rel="stylesheet" href="binding.css">
</head>
<body>
  <main>
    <h1>Runtime Host media binding</h1>
    <p id="status">Ready to discover local media devices.</p>

    <label class="check">
      <input id="discoverAudio" type="checkbox" checked>
      Discover an optional microphone
    </label>

    <button id="discover" type="button">Discover devices</button>

    <section id="selection" hidden>
      <figure id="previewPanel">
        <video id="preview" autoplay muted playsinline></video>
        <figcaption>Local camera preview. Video and audio are not transmitted or recorded.</figcaption>
      </figure>

      <label for="video">Cameras</label>
      <select id="video" multiple size="6"></select>
      <p class="hint">Select one or more cameras. Use Ctrl or Shift to select multiple cameras.</p>

      <label for="audio">Microphone</label>
      <select id="audio">
        <option value="">No microphone</option>
      </select>

      <div class="actions">
        <button id="save" type="button">Save protected candidate</button>
        <button id="cancel" type="button" class="secondary">Cancel</button>
      </div>
    </section>
  </main>
  <script src="binding.js"></script>
</body>
</html>
