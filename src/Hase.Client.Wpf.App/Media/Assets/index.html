<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; media-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>HASE Client Media</title>
  <link rel="stylesheet" href="media.css">
</head>
<body>
  <video id="presentation" autoplay playsinline></video>
  <div id="audio-activation-panel" hidden>
    <button id="enable-audio" type="button">Enable Audio</button>
    <p id="audio-activation-status" role="status" aria-live="polite"></p>
  </div>
  <script src="media.js"></script>
</body>
</html>
